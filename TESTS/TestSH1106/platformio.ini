[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

lib_deps =
  olikraus/U8g2 @ ^2.36.2
  ruiseixasm/Versatile_RotaryEncoder @ ^1.3.1
  ;aki237/Adafruit_ESP32_SH1106 @ ^1.0.2